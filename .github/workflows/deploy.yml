name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: gcp-learn-506415
  REGION: us-east1
  SERVICE_NAME: accountant-agent
  ARTIFACT_REPO: accountant-agent-repo
  RUNTIME_SA: accountant-agent-run   # the service account the container runs as (created by gcp_setup.sh)

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # keyless login (Workload Identity Federation): no JSON key, nothing to leak
          workload_identity_provider: projects/441377835999/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@gcp-learn-506415.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Secrets come from Google Secret Manager (created by gcp_setup.sh), never from the image or the repo.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_TAG }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --port=8080 \
            --memory=4Gi --cpu=2 --cpu-boost \
            --concurrency=10 \
            --min-instances=0 --max-instances=2 \
            --timeout=300 \
            --set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,DATABASE_URL=DATABASE_URL:latest,MEM0_API_KEY=MEM0_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest \
            --allow-unauthenticated \
            --quiet