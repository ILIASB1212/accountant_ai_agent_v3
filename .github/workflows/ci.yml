name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -e .; fi
          pip install pytest pytest-cov

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
        run: |
          python -c "from openai import OpenAI; r=OpenAI().embeddings.create(model='text-embedding-3-large', input=['test']); print('Embedding API works:', len(r.data[0].embedding) > 0)"            
          # pytest src/test/unit_test.py -v --cov=src --cov-report=xml --cov-report=term-missing 

      - name: Upload coverages
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false